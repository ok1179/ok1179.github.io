<script type="text/javascript">
var update;
var sendErrorCount = 0;
var isConnecting = 0;
var urls = '192.168.1.7'.split(';');
var timerID = null;

$(function(){
	initHttpsUrl('https://www.frontier-monitor.com/persite');
	prepFormSmall();

	update = function(status , target) {
		if (target == null) target = 0;
		var homeSvrUrl = urls[target];

		if(!homeSvrUrl || homeSvrUrl == "") {
			doErr(target);
			return;
		}else{
			homeSvrUrl = "http://" + homeSvrUrl + "/GetMonitoringData.cgi";
		}

		var now = new Date();
		var timerout_ = 10 * 1000;

		$.ajax({
			type : 'GET',
			url  : homeSvrUrl,
			timeout : timerout_,
			data : { "time" : now.getTime() },
			dataType : "jsonp",
			jsonpCallback : "getAdded_Power",
			success : function(data) {
				sendErrorCount = 0;
				doView(target , data);
			},
			error : function(XMLHttpRequest, textStatus, errorThrown) {
				doErr(target);
			}
		});
	};
});

function startMonitoring() {
	try{
		isConnecting = 1;
		sendErrorCount = 0;
		update("load", 0);
	}catch( e ){
		doErr(0);
	}
}

function doView(targetIndex , data)
{
	var hatsudenkw = data.added_power;
	var uttakw = data.added_sellpower;
	var kattakw = data.added_buypower;
	var ZERO_FMT = "0.00";

	var hVal = 0, uVal = 0, kVal = 0;

	if((hatsudenkw != "") && (hatsudenkw != null)){
		hVal = roundOff(hatsudenkw);
		$("#hatsudenkw").html(hVal);
	}else{
		$("#hatsudenkw").html(ZERO_FMT);
		hatsudenkw = 0;
	}

	if((uttakw != "") && (uttakw != null)){
		uVal = roundOff(uttakw);
		$("#uttakw").html(uVal);
	}else{
		$("#uttakw").html(ZERO_FMT);
		uttakw = 0;
	}

	if((kattakw != "") && (kattakw != null)){
		kVal = roundOff(kattakw);
		$("#kattakw").html(kVal);
	}else{
		$("#kattakw").html(ZERO_FMT);
		kattakw = 0;
	}

	// 売電中表示切替
	if(parseFloat(uVal) > parseFloat(kVal)) {
		$("#blinking").css("visibility", "visible");
	} else {
		$("#blinking").css("visibility", "hidden");
	}

	var sVal = 0;
	if((hatsudenkw == 0) && (uttakw == 0) && (kattakw == 0)){
		$("#shohikw").html(ZERO_FMT);
	}else{
		sVal = syohi(hatsudenkw, uttakw, kattakw);
		$("#shohikw").html(sVal);
	}

	var useVal = 0;
	if((data.added_power == "") && (data.added_sellpower == "")){
		$("#shiyokw").html(ZERO_FMT);
	}else{
		useVal = shiyo(hatsudenkw, uttakw);
		$("#shiyokw").html(useVal);
	}

	// 1日の集計記録
	recordDailyStats(parseFloat(hVal), parseFloat(sVal), parseFloat(uVal), parseFloat(kVal));

	if ($("#autoRef").val() == "1")
   	{
    	clearTimeout(timerID);
    	timerID = setTimeout(function(){ update("auto", 0); }, 3000);
   	}

	isConnecting = 0;
}

function syohi(hatsudenkw, uttakw, kattakw)
{
	var hatsu = parseFloat(hatsudenkw);
	var uri = parseFloat(uttakw);
	var kai = parseFloat(kattakw);
	var syohi = hatsu - uri + kai;
	return roundOff(syohi);
}

function shiyo(hatsudenkw, uttakw)
{
	var hatsu = parseFloat(hatsudenkw);
	var uri = parseFloat(uttakw);
	var shiyo = hatsu - uri;
	return roundOff(shiyo);
}

function doErr(targetIndex)
{
	sendErrorCount++;
	if (sendErrorCount >= 3) {
		$("#hatsudenkw").html("－");
		$("#uttakw").html("－");
		$("#kattakw").html("－");
		$("#shohikw").html("－");
		$("#shiyokw").html("－");
	}

	if ($("#autoRef").val() == "1")
	{
		clearTimeout(timerID);
		timerID = setTimeout(function(){ update("retry", 0); }, 3000);
	}
	isConnecting = 0;
}

function roundOff(n){
	var val = new Number(n);
	val = val * 100;
	val = val / 1000;
	val = Math.round(val);
	val = val / 100;
	val = val.toFixed(2);
	return val;
}

function chgAutoRef()
{
	var bton_  = './フロンティアモニター/images/auto_on.png';
	var btoff_ = './フロンティアモニター/images/auto_off.png';

    if ($("#autoRef").val() == "1")
   	{
    	$("#autoRef").val("0");
    	$("#btn_r_img").attr("src" , btoff_ );
    	clearTimeout(timerID);
   	}
    else
   	{
    	$("#autoRef").val("1");
    	$("#btn_r_img").attr("src" , bton_ );
    	if (isConnecting == 0)
    	{
    		isConnecting = 1;
    		sendErrorCount = 0;
    		update('autoon' , 0);
    	}
   	}
}

function updateManual()
{
	if (isConnecting == 0)
	{
		isConnecting = 1;
		update('manual' , 0);
	}
}

// ===== 1日の集計 ＆ 時間別ロジック =====
function getTodayDateKey() {
	var d = new Date();
	return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function recordDailyStats(genKw, conKw, sellKw, buyKw) {
	var key = getTodayDateKey();
	var d = new Date();
	var hour = d.getHours();
	var genW = Math.round(genKw * 1000);

	var stat = JSON.parse(localStorage.getItem('solar_stat_' + key) || 'null');
	if (!stat) {
		stat = {
			gen: 0, con: 0, sell: 0, buy: 0,
			hours: { 6: 0, 9: 0, 12: 0, 15: 0, 18: 0 }
		};
	}

	var dt = 3 / 3600; // 3秒間隔積算
	stat.gen += (genKw * dt);
	stat.con += (conKw * dt);
	stat.sell += (sellKw * dt);
	stat.buy += (buyKw * dt);

	if ([6, 9, 12, 15, 18].indexOf(hour) !== -1) {
		stat.hours[hour] = genW;
	}

	localStorage.setItem('solar_stat_' + key, JSON.stringify(stat));

	// 画面反映
	$("#stat-gen").text(stat.gen.toFixed(1) + " kWh");
	$("#stat-con").text(stat.con.toFixed(1) + " kWh");
	$("#stat-sell").text(stat.sell.toFixed(1) + " kWh");
	$("#stat-buy").text(stat.buy.toFixed(1) + " kWh");

	$("#h-6").text((stat.hours[6] || 0) + " W");
	$("#h-9").text((stat.hours[9] || 0) + " W");
	$("#h-12").text((stat.hours[12] || 0) + " W");
	$("#h-15").text((stat.hours[15] || 0) + " W");
	$("#h-18").text((stat.hours[18] || 0) + " W");
	$("#h-now").text(genW + " W");
}

function loadSavedStats() {
	var key = getTodayDateKey();
	var stat = JSON.parse(localStorage.getItem('solar_stat_' + key) || 'null');
	if (stat) {
		$("#stat-gen").text(stat.gen.toFixed(1) + " kWh");
		$("#stat-con").text(stat.con.toFixed(1) + " kWh");
		$("#stat-sell").text(stat.sell.toFixed(1) + " kWh");
		$("#stat-buy").text(stat.buy.toFixed(1) + " kWh");
		if (stat.hours) {
			$("#h-6").text((stat.hours[6] || 0) + " W");
			$("#h-9").text((stat.hours[9] || 0) + " W");
			$("#h-12").text((stat.hours[12] || 0) + " W");
			$("#h-15").text((stat.hours[15] || 0) + " W");
			$("#h-18").text((stat.hours[18] || 0) + " W");
		}
	}
}
</script>

<script type="text/javascript">
// ===== ロック画面・PIN認証処理 =====
var inputPin = "";
var TARGET_PIN = "8004";

function getFailCount() {
  var key = getTodayDateKey();
  var rec = JSON.parse(localStorage.getItem('fail_record') || '{}');
  return rec[key] || 0;
}

function addFailCount() {
  var key = getTodayDateKey();
  var rec = JSON.parse(localStorage.getItem('fail_record') || '{}');
  rec[key] = (rec[key] || 0) + 1;
  localStorage.setItem('fail_record', JSON.stringify(rec));
  return rec[key];
}

function checkDailyLimit() {
  if (getFailCount() >= 5) {
    lockErrorMode();
    return true;
  }
  return false;
}

function lockErrorMode() {
  document.getElementById('day-error').style.display = "block";
  document.getElementById('login-card').className = "login-card lock-red";
  var btns = document.getElementsByClassName('key-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
  }
}

function renderDots() {
  for (var i = 0; i < 4; i++) {
    var dot = document.getElementById('pdot-' + i);
    if (i < inputPin.length) {
      dot.className = "pass-dot filled";
    } else {
      dot.className = "pass-dot";
    }
  }
}

function addPin(n) {
  if (checkDailyLimit() || inputPin.length >= 4) return;
  inputPin += n;
  renderDots();
  if (inputPin.length === 4) {
    setTimeout(verifyCode, 100);
  }
}

function delPin() {
  if (inputPin.length > 0) {
    inputPin = inputPin.substring(0, inputPin.length - 1);
    renderDots();
  }
}

function clearPin() {
  inputPin = "";
  renderDots();
}

function verifyCode() {
  if (inputPin === TARGET_PIN) {
    if (document.getElementById('persist-auth').checked) {
      var expiryTime = new Date().getTime() + (24 * 60 * 60 * 1000);
      localStorage.setItem('auth_expiry', expiryTime);
    }
    unlock();
  } else {
    var count = addFailCount();
    for (var i = 0; i < 4; i++) {
      document.getElementById('pdot-' + i).className = "pass-dot error";
    }
    setTimeout(function() {
      clearPin();
      if (count >= 5) {
        lockErrorMode();
      }
    }, 400);
  }
}

function unlock() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('Container2').style.display = 'block';
  loadSavedStats();
  startMonitoring();
}

window.onkeydown = function(e) {
  if (document.getElementById('login-screen').style.display === 'none') return;
  var key = e.key;
  if (key >= '0' && key <= '9') {
    addPin(key);
  } else if (key === 'Backspace') {
    delPin();
  }
};

window.onload = function() {
  var expiry = localStorage.getItem('auth_expiry');
  if (expiry && new Date().getTime() < parseInt(expiry)) {
    unlock();
    return;
  }
  checkDailyLimit();
};
</script>

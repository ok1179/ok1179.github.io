<script type="text/javascript">
//更新処理
var update;
//更新処理失敗回数
var sendErrorCount = 0;
//通信中フラグ
var isConnecting = 0;
//接続先IP配列
var urls ='192.168.1.7'.split(';');
var timerID = null;

$(function(){
	initHttpsUrl('https://www.frontier-monitor.com/persite');
	prepFormSmall();

	//画面定期更新関数定義
	update = function(status , target) {
		if (target == null) target = 0;
		var homeSvrUrl= urls[target];

		if( homeSvrUrl == "") {
			doErr(target);
			return;
		}else{
			homeSvrUrl = "http://" + homeSvrUrl + "/GetMonitoringData.cgi";
		}

		var now = new Date();
		var timerout_ = 5 * 1000;

		$.ajax({
			type : 'POST',
			url  : homeSvrUrl,
			timeout : timerout_,
			data : {
				  "time" : now.getTime()
			},
			dataType : "jsonp",
			jsonpCallback : "getAdded_Power",
			success : function(data) {
				doView(target , data);
			},
			error : function(XMLHttpRequest, textStatus, errorThrown) {
				doErr(target);
			}
		});
	};
});

function startMonitoring() {
	try{
		isConnecting = 1;
		update("load", 0);
	}catch( e ){
		doErr();
	}
}

function doView(targetIndex , data)
{
	var hatsudenkw = data.added_power;
	var uttakw = data.added_sellpower;
	var kattakw = data.added_buypower;
	var ZERO_FMT = "0.00";

	if((hatsudenkw != "") && (hatsudenkw != null)){
		hatsuden = roundOff(hatsudenkw);
		$("#hatsudenkw") .html(hatsuden);
	}else{
		$("#hatsudenkw") .html(ZERO_FMT);
		hatsudenkw = 0;
	}

	if((uttakw != "") && (uttakw != null)){
		utta = roundOff(uttakw);
		$("#uttakw") .html(utta);
	}else{
		$("#uttakw") .html(ZERO_FMT);
		uttakw = 0;
	}

	if((kattakw != "") && (kattakw != null)){
		katta = roundOff(kattakw);
		$("#kattakw") .html(katta);
	}else{
		$("#kattakw") .html(ZERO_FMT);
		kattakw = 0;
	}

	if(parseFloat(utta) > parseFloat(katta)) {
		$("#blinking").attr("src", "./フロンティアモニター/images/blink4moment.gif");
	} else {
		$("#blinking").attr("src", "./フロンティアモニター/images/clear.gif");
	}

	if((hatsudenkw == 0) && (uttakw == 0) && (kattakw == 0)){
		$("#shohikw") .html(ZERO_FMT);
	}else{
		var shohikw = syohi(hatsudenkw, uttakw, kattakw);
		$("#shohikw") .html(shohikw  );
	}

	if((data.added_power == "") && (data.added_sellpower == "")){
		$("#shiyokw") .html(ZERO_FMT);
	}else{
		var shiyokw = shiyo(hatsudenkw, uttakw);
		$("#shiyokw") .html(shiyokw  );
	}

    if ($("#autoRef").val() == "1")
   	{
    	var timerInterval = 1 * 1000;
    	timerID = setTimeout(update, timerInterval);
   	}

	isConnecting = 0;
}

function syohi(hatsudenkw, uttakw, kattakw)
{
	var hatsu = parseFloat(hatsudenkw);
	var uri = parseFloat(uttakw);
	var kai = parseFloat(kattakw);
	var syohi = hatsu - uri + kai;
	syohi = roundOff(syohi);
	return syohi;
}

function shiyo(hatsudenkw, uttakw)
{
	var hatsu = parseFloat(hatsudenkw);
	var uri = parseFloat(uttakw);
	var shiyo = hatsu - uri;
	shiyo = roundOff(shiyo);
	return shiyo;
}

function doErr(targetIndex)
{
	$("#hatsudenkw") .html("－");
	$("#uttakw") .html("－");
	$("#kattakw") .html("－");
	$("#shohikw") .html("－");
	$("#shiyokw") .html("－");

	targetIndex ++ ;
	if (targetIndex < urls.length)
	{
		update("retry" , targetIndex);
		return;
	}

	if ($("#autoRef").val() == "1")
	{
		sendErrorCount++;
		if ( sendErrorCount < 3 )
		{
	    	var timerInterval = 1 * 1000;
	    	setTimeout(update, timerInterval);
	    	return;
		}
		else
		{
		    chgAutoRef();
		}
	}
	isConnecting = 0;
}

function roundOff(n){
	var val = new Number(n);
	val = val * 100;
	val = val / 1000;
	val = Math.round(val);
	val = val / 100;
	val = val.toFixed(2);
	return val;
}

function chgAutoRef()
{
	var bton_  = './フロンティアモニター/images/auto_on.png';
	var btoff_ = './フロンティアモニター/images/auto_off.png';

    if ($("#autoRef").val() == "1")
   	{
    	$("#autoRef").val("0");
    	$("#btn_r_img").attr("src" , btoff_ );
   	}
    else
   	{
    	$("#autoRef").val("1");
    	$("#btn_r_img").attr("src" , bton_ );
    	if (isConnecting == 0)
    	{
    		isConnecting = 1;
    		sendErrorCount = 0;
    		update('autoon' , 0);
    	}
   	}
}

function updateManual()
{
	if (isConnecting == 0)
	{
		isConnecting = 1;
		update('manual' , 0);
	}
}
</script>

<style type="text/css">
/* ===== ロック画面 (テレビ完全中央配置対応) ===== */
#login-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
  background-color: #f2f2f7;
  z-index: 999999;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: center;
  -ms-flex-pack: center;
  justify-content: center;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  text-align: center;
}

.login-card {
  margin: auto;
  background: #ffffff;
  padding: 30px 24px;
  border-radius: 16px;
  text-align: center;
  width: 320px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
  box-sizing: border-box;
}

.login-card h2 {
  font-size: 20px;
  font-weight: bold;
  margin: 0 0 16px 0;
  color: #1c1c1e;
}

/* PIN ドット表示 */
.pass-container {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
}

.pass-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid #c7c7cc;
  background-color: transparent;
  box-sizing: border-box;
}

.pass-dot.filled {
  background-color: #007aff;
  border-color: #007aff;
}

.pass-dot.error {
  background-color: #ff3b30 !important;
  border-color: #ff3b30 !important;
}

/* テンキー (リモコンで押せる) */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.key-btn {
  background-color: #f2f2f7;
  border: 1px solid #d1d1d6;
  border-radius: 10px;
  font-size: 22px;
  font-weight: bold;
  color: #000;
  padding: 12px 0;
  cursor: pointer;
  outline: none;
}

.key-btn:focus, .key-btn:hover {
  background-color: #007aff;
  color: #fff;
  border-color: #007aff;
}

.key-btn.sub {
  font-size: 14px;
  color: #8e8e93;
}

.day-error-box {
  margin: 10px 0;
  font-size: 13px;
  font-weight: bold;
  color: #ff3b30;
  display: none;
}

.lock-red {
  border: 2px solid #ff3b30;
}

/* スイッチ */
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f9f9f9;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  color: #3a3a3c;
}

.ios-switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 26px;
}

.ios-switch input { opacity: 0; width: 0; height: 0; }

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #e9e9ea;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 22px;
  width: 22px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

input:checked + .slider { background-color: #34c759; }
input:checked + .slider:before { transform: translateX(18px); }

/* 初期状態でメイン画面を隠す */
#Container2 {
  display: none;
}
</style>
</head>

<script type="text/javascript">
// ===== ロック画面・PIN認証ロジック =====
var inputPin = "";
var TARGET_PIN = "8004";

function getTodayKey() {
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function getFailCount() {
  var key = getTodayKey();
  var rec = JSON.parse(localStorage.getItem('fail_record') || '{}');
  return rec[key] || 0;
}

function addFailCount() {
  var key = getTodayKey();
  var rec = JSON.parse(localStorage.getItem('fail_record') || '{}');
  rec[key] = (rec[key] || 0) + 1;
  localStorage.setItem('fail_record', JSON.stringify(rec));
  return rec[key];
}

function checkDailyLimit() {
  if (getFailCount() >= 5) {
    lockErrorMode();
    return true;
  }
  return false;
}

function lockErrorMode() {
  document.getElementById('day-error').style.display = "block";
  document.getElementById('login-card').className = "login-card lock-red";
  var btns = document.getElementsByClassName('key-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
  }
}

function renderDots() {
  for (var i = 0; i < 4; i++) {
    var dot = document.getElementById('pdot-' + i);
    if (i < inputPin.length) {
      dot.className = "pass-dot filled";
    } else {
      dot.className = "pass-dot";
    }
  }
}

function addPin(n) {
  if (checkDailyLimit() || inputPin.length >= 4) return;
  inputPin += n;
  renderDots();

  if (inputPin.length === 4) {
    setTimeout(verifyCode, 100);
  }
}

function delPin() {
  if (inputPin.length > 0) {
    inputPin = inputPin.substring(0, inputPin.length - 1);
    renderDots();
  }
}

function clearPin() {
  inputPin = "";
  renderDots();
}

function verifyCode() {
  if (inputPin === TARGET_PIN) {
    if (document.getElementById('persist-auth').checked) {
      var expiryTime = new Date().getTime() + (24 * 60 * 60 * 1000);
      localStorage.setItem('auth_expiry', expiryTime);
    }
    unlock();
  } else {
    var count = addFailCount();
    for (var i = 0; i < 4; i++) {
      document.getElementById('pdot-' + i).className = "pass-dot error";
    }
    setTimeout(function() {
      clearPin();
      if (count >= 5) {
        lockErrorMode();
      }
    }, 400);
  }
}

function unlock() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('Container2').style.display = 'block';
  // モニター通信開始
  startMonitoring();
}

// 物理キーボード / リモコン数字キー対応
window.onkeydown = function(e) {
  if (document.getElementById('login-screen').style.display === 'none') return;
  var key = e.key || String.fromCharCode(e.keyCode);
  if (key >= '0' && key <= '9') {
    addPin(key);
  } else if (e.keyCode === 8) { // Backspace
    delPin();
  }
};

// 起動時チェック
window.onload = function() {
  var expiry = localStorage.getItem('auth_expiry');
  if (expiry && new Date().getTime() < parseInt(expiry)) {
    unlock();
    return;
  }
  checkDailyLimit();
};
</script>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ja" xml:lang="ja" dir="ltr">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="Expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フロンティアモニター - リアルタイム値</title>

<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

<style type="text/css">
/* ===== 基本カラー設定 ===== */
:root {
  --bg-color: #f1f5f9;
  --panel-bg: #ffffff;
  --border-color: #cbd5e1;
  --text-main: #0f172a;
  --text-sub: #475569;
  --text-muted: #94a3b8;

  --sell-color: #059669;
  --sell-bg: #ecfdf5;
  --sell-border: #6ee7b7;

  --buy-color: #dc2626;
  --buy-bg: #fef2f2;
  --buy-border: #fca5a5;

  --solar-color: #d97706;
  --solar-bg: #fffbeb;
  --solar-border: #fcd34d;

  --consume-color: #0284c7;
  --consume-bg: #f0f9ff;
  --consume-border: #7dd3fc;

  --use-color: #7e22ce;
  --use-bg: #faf5ff;
  --use-border: #d8b4fe;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  min-height: 100vh;
  padding: 20px 10px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* ===== ロック画面 ===== */
#login-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: var(--bg-color);
  z-index: 999999;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.login-card {
  margin: auto;
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 30px 24px;
  width: 320px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

.login-card h2 {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 16px;
  color: var(--text-main);
}

.pass-container {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
}

.pass-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid #cbd5e1;
  background-color: #ffffff;
}

.pass-dot.filled {
  background-color: #0284c7;
  border-color: #0284c7;
}

.pass-dot.error {
  background-color: #dc2626 !important;
  border-color: #dc2626 !important;
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.key-btn {
  background-color: #f8fafc;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  font-size: 22px;
  font-weight: bold;
  color: var(--text-main);
  padding: 12px 0;
  cursor: pointer;
  outline: none;
}

.key-btn:focus, .key-btn:hover {
  background-color: #0284c7;
  color: #ffffff;
  border-color: #0284c7;
}

.key-btn.sub {
  font-size: 14px;
  color: var(--text-sub);
}

.day-error-box {
  margin: 10px 0;
  font-size: 13px;
  font-weight: bold;
  color: #dc2626;
  display: none;
}

.lock-red { border: 2px solid #dc2626 !important; }

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f8fafc;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  color: var(--text-sub);
}

.ios-switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 26px;
}
.ios-switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #cbd5e1;
  border-radius: 34px;
}
.slider:before {
  position: absolute; content: "";
  height: 20px; width: 20px;
  left: 3px; bottom: 3px;
  background-color: white;
  border-radius: 50%;
  transition: 0.2s;
}
input:checked + .slider { background-color: #10b981; }
input:checked + .slider:before { transform: translateX(18px); }

/* ===== メインモニター（一体型） ===== */
#Container2 {
  display: none;
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  flex-direction: column;
}

#PopUpContents {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ヘッダー操作部 */
.header-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}

.css-btn {
  background: #f1f5f9;
  border: 1px solid var(--border-color);
  color: var(--text-sub);
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  outline: none;
}

.css-btn:hover { background: #e2e8f0; }
.css-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; }

#blinking-badge {
  display: none;
  background: var(--sell-bg);
  color: var(--sell-color);
  border: 1px solid var(--sell-border);
  font-size: 13px;
  font-weight: bold;
  padding: 6px 14px;
  border-radius: 8px;
}

/* ===== 純CSSアイコン (絵文字なし) ===== */
.css-icon {
  width: 22px;
  height: 22px;
  position: relative;
  display: inline-block;
  flex-shrink: 0;
}

/* 1. 売電アイコン (上矢印) */
.icon-sell::before {
  content: ""; position: absolute; left: 5px; top: 1px;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid var(--sell-color);
}
.icon-sell::after {
  content: ""; position: absolute; left: 9px; top: 8px; width: 4px; height: 11px; background: var(--sell-color);
}

/* 2. 買電アイコン (下矢印) */
.icon-buy::before {
  content: ""; position: absolute; left: 5px; bottom: 1px;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--buy-color);
}
.icon-buy::after {
  content: ""; position: absolute; left: 9px; top: 3px; width: 4px; height: 11px; background: var(--buy-color);
}

/* 3. 太陽光発電アイコン (太陽) */
.icon-solar::before {
  content: ""; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--solar-color);
}
.icon-solar::after {
  content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px dashed var(--solar-color);
}

/* 4. 消費アイコン (家) */
.icon-consume::before {
  content: ""; position: absolute; left: 4px; top: 2px;
  border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 7px solid var(--consume-color);
}
.icon-consume::after {
  content: ""; position: absolute; left: 6px; top: 9px; width: 10px; height: 9px; background: var(--consume-color);
}

/* 5. 自家消費アイコン (循環ループ) */
.icon-use::before {
  content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--use-color); border-top-color: transparent;
}
.icon-use::after {
  content: ""; position: absolute; right: 2px; top: 1px;
  border-left: 4px solid var(--use-color); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
}

/* 電力ブロック */
.relationBlock {
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid transparent;
}

.block-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.block-label {
  font-size: 14px;
  font-weight: bold;
}

.block-value {
  text-align: right;
  white-space: nowrap;
}

.numTxt {
  font-size: 32px;
  font-weight: bold;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1;
}

.unitTxt {
  font-size: 14px;
  font-weight: bold;
  margin-left: 4px;
  color: var(--text-sub);
}

/* 色分け */
#rEPG { background: var(--sell-bg); border-color: var(--sell-border); }
#rEPG .block-label, #rEPG .numTxt { color: var(--sell-color); }

#rSell { background: var(--buy-bg); border-color: var(--buy-border); }
#rSell .block-label, #rSell .numTxt { color: var(--buy-color); }

#rBuy { background: var(--solar-bg); border-color: var(--solar-border); }
#rBuy .block-label, #rBuy .numTxt { color: var(--solar-color); }

#rConsumption { background: var(--consume-bg); border-color: var(--consume-border); }
#rConsumption .block-label, #rConsumption .numTxt { color: var(--consume-color); }

#rUse { background: var(--use-bg); border-color: var(--use-border); }
#rUse .block-label, #rUse .numTxt { color: var(--use-color); }

/* ===== 集計データセクション ===== */
.integrated-stats-section {
  border-top: 1px solid var(--border-color);
  padding-top: 16px;
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.stats-title {
  font-size: 14px;
  font-weight: bold;
  color: var(--text-main);
}

.stats-grid-2x2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-card {
  background: #f8fafc;
  border: 1px solid var(--border-color);
  padding: 10px 12px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-card-title {
  font-size: 12px;
  color: var(--text-sub);
  font-weight: bold;
}

.stat-card-val {
  font-size: 18px;
  font-weight: bold;
  text-align: right;
}

.hourly-table {
  width: 100%;
  border-collapse: collapse;
}

.hourly-table th, .hourly-table td {
  border: 1px solid var(--border-color);
  padding: 6px 2px;
  text-align: center;
  font-size: 12px;
}

.hourly-table th {
  background: #f8fafc;
  color: var(--text-sub);
  font-weight: bold;
}

.hourly-table td {
  font-weight: bold;
  color: var(--text-main);
}

.hourly-table td.current-time-cell {
  background: var(--solar-bg);
  color: var(--solar-color);
}

#PopUpFooter {
  text-align: center;
  padding: 12px 0 0 0;
  font-size: 11px;
  color: var(--text-muted);
}
</style>
</head>

<body>

<div id="login-screen">

<!-- ===== モニター本体 ===== -->
<div id="Container2">
  <div id="PopUpContents">
    <!-- 操作ヘッダー -->

<script type="text/javascript">
// ==================== 初期バージョン完全準拠の通信ロジック ====================
var update;
var sendErrorCount = 0;
var isConnecting = 0;
var urls = '192.168.1.7'.split(';');
var timerID = null;
var lastRecordTime = null;

$(function(){
  // 画面定期更新関数定義 (初期コード仕様)
  update = function(status , target) {
    if (target == null) target = 0;
    var homeSvrUrl = urls[target];

    if(!homeSvrUrl || homeSvrUrl == "") {
      doErr(target);
      return;
    }else{
      homeSvrUrl = "http://" + homeSvrUrl + "/GetMonitoringData.cgi";
    }

    var now = new Date();
    var timerout_ = 5 * 1000;

    $.ajax({
      type : 'POST', // 初期バージョン準拠のPOST
      url  : homeSvrUrl,
      timeout : timerout_,
      data : {
        "time" : now.getTime()
      },
      dataType : "jsonp",
      jsonpCallback : "getAdded_Power",
      success : function(data) {
        doView(target , data);
      },
      error : function(XMLHttpRequest, textStatus, errorThrown) {
        doErr(target);
      }
    });
  };
});

function startMonitoring() {
  try {
    isConnecting = 1;
    update("load", 0);
  } catch( e ) {
    doErr();
  }
}

function doView(targetIndex , data)
{
  var hatsudenkw = data.added_power;
  var uttakw = data.added_sellpower;
  var kattakw = data.added_buypower;
  var ZERO_FMT = "0.00";

  var utta = ZERO_FMT;
  var katta = ZERO_FMT;
  var hatsuden = ZERO_FMT;

  if((uttakw != "") && (uttakw != null)){
    utta = roundOff(uttakw);
    $("#uttakw").html(utta);
  }else{
    $("#uttakw").html(ZERO_FMT);
    uttakw = 0;
  }

  if((kattakw != "") && (kattakw != null)){
    katta = roundOff(kattakw);
    $("#kattakw").html(katta);
  }else{
    $("#kattakw").html(ZERO_FMT);
    kattakw = 0;
  }

  if((hatsudenkw != "") && (hatsudenkw != null)){
    hatsuden = roundOff(hatsudenkw);
    $("#hatsudenkw").html(hatsuden);
  }else{
    $("#hatsudenkw").html(ZERO_FMT);
    hatsudenkw = 0;
  }

  // 売っている電力点滅 / バッジ表示
  if(parseFloat(utta) > parseFloat(katta)) {
    $("#blinking-badge").show();
  } else {
    $("#blinking-badge").hide();
  }

  var shohikw = ZERO_FMT;
  if((hatsudenkw == 0) && (uttakw == 0) && (kattakw == 0)){
    $("#shohikw").html(ZERO_FMT);
  }else{
    shohikw = syohi(hatsudenkw, uttakw, kattakw);
    $("#shohikw").html(shohikw);
  }

  var shiyokw = ZERO_FMT;
  if((data.added_power == "") && (data.added_sellpower == "")){
    $("#shiyokw").html(ZERO_FMT);
  }else{
    shiyokw = shiyo(hatsudenkw, uttakw);
    $("#shiyokw").html(shiyokw);
  }

  // 集計データ更新
  recordDailyStats(parseFloat(hatsuden), parseFloat(shohikw), parseFloat(utta), parseFloat(katta));

  // 1秒ごとの定期更新ループ
  if ($("#autoRef").val() == "1")
  {
    var timerInterval = 1 * 1000;
    clearTimeout(timerID);
    timerID = setTimeout(update, timerInterval);
  }

  isConnecting = 0;
}

function syohi(hatsudenkw, uttakw, kattakw)
{
  var hatsu = parseFloat(hatsudenkw);
  var uri = parseFloat(uttakw);
  var kai = parseFloat(kattakw);
  var syohi = hatsu - uri + kai;
  syohi = roundOff(syohi);
  return syohi;
}

function shiyo(hatsudenkw, uttakw)
{
  var hatsu = parseFloat(hatsudenkw);
  var uri = parseFloat(uttakw);
  var shiyo = hatsu - uri;
  shiyo = roundOff(shiyo);
  return shiyo;
}

function doErr(targetIndex)
{
  $("#hatsudenkw").html("－");
  $("#uttakw").html("－");
  $("#kattakw").html("－");
  $("#shohikw").html("－");
  $("#shiyokw").html("－");

  targetIndex++;
  if (targetIndex < urls.length)
  {
    update("retry", targetIndex);
    return;
  }

  if ($("#autoRef").val() == "1")
  {
    sendErrorCount++;
    if (sendErrorCount < 3)
    {
      var timerInterval = 1 * 1000;
      setTimeout(update, timerInterval);
      return;
    }
    else
    {
      chgAutoRef();
    }
  }

  isConnecting = 0;
}

function roundOff(n){
  var val = new Number(n);
  val = val * 100;
  val = val / 1000;
  val = Math.round(val);
  val = val / 100;
  val = val.toFixed(2);
  return val;
}

function chgAutoRef()
{
  if ($("#autoRef").val() == "1")
  {
    $("#autoRef").val("0");
    $("#btn_auto").removeClass("active").text("自動更新: OFF");
    clearTimeout(timerID);
  }
  else
  {
    $("#autoRef").val("1");
    $("#btn_auto").addClass("active").text("自動更新: ON");
    if (isConnecting == 0)
    {
      isConnecting = 1;
      sendErrorCount = 0;
      update('autoon' , 0);
    }
  }
}

function updateManual()
{
  if (isConnecting == 0)
  {
    isConnecting = 1;
    update('manual' , 0);
  }
}

// ===== 1日の集計 ＆ 時間別データ =====
function getTodayDateKey() {
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function recordDailyStats(genKw, conKw, sellKw, buyKw) {
  var key = getTodayDateKey();
  var now = new Date();
  var hour = now.getHours();
  var genW = Math.round(genKw * 1000);

  var stat = JSON.parse(localStorage.getItem('solar_stat_' + key) || 'null');
  if (!stat) {
    stat = {
      gen: 0, con: 0, sell: 0, buy: 0,
      hours: { 6: 0, 9: 0, 12: 0, 15: 0, 18: 0 }
    };
  }

  var dt = 1 / 3600;
  if (lastRecordTime) {
    dt = (now.getTime() - lastRecordTime) / (3600 * 1000);
    if (dt > 0.01) dt = 1 / 3600;
  }
  lastRecordTime = now.getTime();

  stat.gen += (genKw * dt);
  stat.con += (conKw * dt);
  stat.sell += (sellKw * dt);
  stat.buy += (buyKw * dt);

  if ([6, 9, 12, 15, 18].indexOf(hour) !== -1) {
    stat.hours[hour] = Math.max(stat.hours[hour] || 0, genW);
  }

  localStorage.setItem('solar_stat_' + key, JSON.stringify(stat));

  $("#stat-gen").text(stat.gen.toFixed(2) + " kWh");
  $("#stat-con").text(stat.con.toFixed(2) + " kWh");
  $("#stat-sell").text(stat.sell.toFixed(2) + " kWh");
  $("#stat-buy").text(stat.buy.toFixed(2) + " kWh");

  $("#h-6").text((stat.hours[6] || 0) + " W");
  $("#h-9").text((stat.hours[9] || 0) + " W");
  $("#h-12").text((stat.hours[12] || 0) + " W");
  $("#h-15").text((stat.hours[15] || 0) + " W");
  $("#h-18").text((stat.hours[18] || 0) + " W");
  $("#h-now").text(genW + " W");
}

function loadSavedStats() {
  var key = getTodayDateKey();
  var stat = JSON.parse(localStorage.getItem('solar_stat_' + key) || 'null');
  if (stat) {
    $("#stat-gen").text(stat.gen.toFixed(2) + " kWh");
    $("#stat-con").text(stat.con.toFixed(2) + " kWh");
    $("#stat-sell").text(stat.sell.toFixed(2) + " kWh");
    $("#stat-buy").text(stat.buy.toFixed(2) + " kWh");
    if (stat.hours) {
      $("#h-6").text((stat.hours[6] || 0) + " W");
      $("#h-9").text((stat.hours[9] || 0) + " W");
      $("#h-12").text((stat.hours[12] || 0) + " W");
      $("#h-15").text((stat.hours[15] || 0) + " W");
      $("#h-18").text((stat.hours[18] || 0) + " W");
    }
  }
}

// ==================== PIN認証 ====================
var inputPin = "";
var TARGET_PIN = "8004";

function getFailCount() {
  var key = getTodayDateKey();
  var rec = JSON.parse(localStorage.getItem('fail_record') || '{}');
  return rec[key] || 0;
}

function addFailCount() {
  var key = getTodayDateKey();
  var rec = JSON.parse(localStorage.getItem('fail_record') || '{}');
  rec[key] = (rec[key] || 0) + 1;
  localStorage.setItem('fail_record', JSON.stringify(rec));
  return rec[key];
}

function checkDailyLimit() {
  if (getFailCount() >= 5) {
    lockErrorMode();
    return true;
  }
  return false;
}

function lockErrorMode() {
  document.getElementById('day-error').style.display = "block";
  document.getElementById('login-card').className = "login-card lock-red";
  var btns = document.getElementsByClassName('key-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
  }
}

function renderDots() {
  for (var i = 0; i < 4; i++) {
    var dot = document.getElementById('pdot-' + i);
    if (i < inputPin.length) {
      dot.className = "pass-dot filled";
    } else {
      dot.className = "pass-dot";
    }
  }
}

function addPin(n) {
  if (checkDailyLimit() || inputPin.length >= 4) return;
  inputPin += n;
  renderDots();
  if (inputPin.length === 4) {
    setTimeout(verifyCode, 100);
  }
}

function delPin() {
  if (inputPin.length > 0) {
    inputPin = inputPin.substring(0, inputPin.length - 1);
    renderDots();
  }
}

function clearPin() {
  inputPin = "";
  renderDots();
}

function verifyCode() {
  if (inputPin === TARGET_PIN) {
    if (document.getElementById('persist-auth').checked) {
      var expiryTime = new Date().getTime() + (24 * 60 * 60 * 1000);
      localStorage.setItem('auth_expiry', expiryTime);
    }
    unlock();
  } else {
    var count = addFailCount();
    for (var i = 0; i < 4; i++) {
      document.getElementById('pdot-' + i).className = "pass-dot error";
    }
    setTimeout(function() {
      clearPin();
      if (count >= 5) {
        lockErrorMode();
      }
    }, 400);
  }
}

function unlock() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('Container2').style.display = 'flex';
  loadSavedStats();
  startMonitoring();
}

window.onkeydown = function(e) {
  if (document.getElementById('login-screen').style.display === 'none') return;
  var key = e.key;
  if (key >= '0' && key <= '9') {
    addPin(key);
  } else if (key === 'Backspace') {
    delPin();
  }
};

window.onload = function() {
  var expiry = localStorage.getItem('auth_expiry');
  if (expiry && new Date().getTime() < parseInt(expiry)) {
    unlock();
    return;
  }
  checkDailyLimit();
};
</script>
